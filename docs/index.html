<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daftar design preview: coach booking and set logging, Persian and English. Sample data.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daftar Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Vazirmatn:wght@100..900&display=swap">
<style>
/* ==========================================================================
   Daftar design preview. Tokens from docs/DESIGN.md ("chalk on steel" / "rubber floor").
   Logical properties only; the two gutter paddings below are the single physical exception.
   ========================================================================== */
:root {
  --paper: #EBECE8;
  --paper-2: #DFE1DC;
  --card: #F8F8F6;
  --ink: #141614;
  --ink-2: #444843;
  --ink-3: #5F655E;
  --rule: rgb(20 22 20 / 0.16);
  --rule-strong: #141614;
  --plate-red: #C0211A;
  --plate-blue: #1D4C9F;
  --plate-yellow: #E3AE12;
  --plate-green: #2B7A42;
  --plate-white: #FBFBF8;
  --danger: #8E1B12;
  --on-plate: #FFFFFF;
  --on-yellow: #141614;
  --scrim: rgb(20 22 20 / 0.55);
  --chrome-bg: #141614;
  --chrome-fg: #EBECE8;
  --chrome-dim: #B7BBB4;
  --hatch: repeating-linear-gradient(45deg, transparent 0 5px, var(--rule) 5px 6.5px);
  --r: 2px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --f-en: "Archivo", "Vazirmatn", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-fa: "Vazirmatn", "Archivo", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111311;
    --paper-2: #191C19;
    --card: #1D201D;
    --ink: #E8EAE5;
    --ink-2: #AEB3AB;
    --ink-3: #8C9289;
    --rule: rgb(232 234 229 / 0.15);
    --rule-strong: #E8EAE5;
    --plate-red: #E2463B;
    --plate-blue: #6A95E6;
    --plate-yellow: #F0C232;
    --plate-green: #4FAE6A;
    --plate-white: #E8EAE5;
    --danger: #F07466;
    --on-plate: #111311;
    --on-yellow: #111311;
    --scrim: rgb(0 0 0 / 0.66);
    --chrome-bg: #050605;
    --chrome-fg: #E8EAE5;
    --chrome-dim: #AEB3AB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111311;
  --paper-2: #191C19;
  --card: #1D201D;
  --ink: #E8EAE5;
  --ink-2: #AEB3AB;
  --ink-3: #8C9289;
  --rule: rgb(232 234 229 / 0.15);
  --rule-strong: #E8EAE5;
  --plate-red: #E2463B;
  --plate-blue: #6A95E6;
  --plate-yellow: #F0C232;
  --plate-green: #4FAE6A;
  --plate-white: #E8EAE5;
  --danger: #F07466;
  --on-plate: #111311;
  --on-yellow: #111311;
  --scrim: rgb(0 0 0 / 0.66);
  --chrome-bg: #050605;
  --chrome-fg: #E8EAE5;
  --chrome-dim: #AEB3AB;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); }
[hidden] { display: none !important; }
#app {
  min-height: 100vh;
  font-family: var(--f-en);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  --chrome-h: 52px;
  --fp: 0px;
}
#app[lang="fa"] { font-family: var(--f-fa); line-height: 1.75; }
:where(#app) :is(h1, h2, h3, p, ul, ol, dl, dd, figure) { margin: 0; padding: 0; }
:where(#app) :is(ul, ol) { list-style: none; }
:where(#app) :is(button, input, textarea, select) { font: inherit; color: inherit; letter-spacing: inherit; }
:where(#app) button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:where(#app) a { color: inherit; }
:where(#app) textarea { resize: vertical; }
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; box-shadow: 0 0 0 2px var(--paper); }
.sr-only { position: fixed; inset-block-start: 0; inset-inline-start: 0; inline-size: 1px; block-size: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
#app[lang="en"] .num { font-stretch: 75%; font-weight: 700; letter-spacing: 0.01em; }
#app[lang="fa"] .num { font-weight: 700; }
.latin { font-family: var(--f-en); }
.ic { inline-size: 20px; block-size: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
#app[dir="rtl"] .ic.flip { transform: scaleX(-1); }
.muted { color: var(--ink-2); }
.cap { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
#app[lang="fa"] .cap { font-size: 13px; line-height: 1.7; }
.fine { font-size: 14px; color: var(--ink-2); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

.display { font-weight: 800; line-height: 1.05; }
#app[lang="en"] .display { font-stretch: 112%; letter-spacing: -0.01em; }
#app[lang="fa"] .display { font-weight: 800; line-height: 1.35; }
.t1 { font-size: 28px; line-height: 1.15; text-wrap: balance; }
#app[lang="fa"] .t1 { line-height: 1.4; }
.t2 { font-size: 20px; line-height: 1.25; font-weight: 800; text-wrap: balance; }
#app[lang="en"] .t2 { font-stretch: 112%; font-size: 18px; }
#app[lang="fa"] .t2 { line-height: 1.5; }

/* ---------- preview chrome (not part of the app UI) ---------- */
.chrome {
  position: sticky;
  inset-block-start: env(safe-area-inset-top, 0px);
  z-index: 60;
  background: var(--chrome-bg);
  color: var(--chrome-fg);
  border-block-end: 1px solid var(--rule);
}
.chrome-in { display: flex; align-items: center; gap: 12px; min-block-size: var(--chrome-h); max-inline-size: 1280px; margin-inline: auto; }
.pv-brand { display: none; flex-direction: column; line-height: 1.25; flex: none; }
.pv-brand b { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
.pv-note { font-size: 12px; color: var(--chrome-dim); }
.pv-nav { flex: 1 1 auto; min-inline-size: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 4px; }
.pv-nav::-webkit-scrollbar { display: none; }
.pv-link {
  flex: none; min-block-size: 44px; display: inline-flex; align-items: center; padding: 0 12px;
  font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; color: var(--chrome-dim);
  border-radius: var(--r); transition-property: background-color, color; transition-duration: 150ms; transition-timing-function: var(--ease);
}
.pv-link:hover { color: var(--chrome-fg); }
.pv-link[aria-current="page"] { background: var(--chrome-fg); color: var(--chrome-bg); }
.pv-sep { flex: none; inline-size: 1px; block-size: 20px; background: var(--rule); margin-inline: 4px; }
.chrome :focus-visible { outline-color: var(--chrome-fg); box-shadow: none; }
.pv-ctl { flex: none; display: flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--chrome-dim); border-radius: var(--r); overflow: hidden; }
.seg button { min-block-size: 44px; min-inline-size: 44px; padding: 0 10px; font-size: 13px; font-weight: 700; color: var(--chrome-dim); transition-property: background-color, color; transition-duration: 150ms; }
.seg button[aria-pressed="true"] { background: var(--chrome-fg); color: var(--chrome-bg); }
.chrome .iconbtn { background: transparent; min-block-size: 44px; min-inline-size: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--chrome-dim); border-radius: var(--r); color: var(--chrome-fg); padding: 0 10px; font-size: 13px; font-weight: 700; }
.chrome .iconbtn:hover { background: transparent; }
.pv-theme-txt { display: none; }
.pv-note-m { padding-block: 8px 0; font-size: 12px; color: var(--ink-3); }
@media (min-width: 720px) {
  .pv-brand { display: flex; }
  .pv-note-m { display: none; }
  .pv-theme-txt { display: inline; }
}

/* ---------- layout ---------- */
.wrap { padding-block: 16px 48px; }
@media (min-width: 720px) { .wrap { padding-block: 24px 72px; } #app { --fp: 20px; } }
.screen { max-inline-size: 1200px; margin-inline: auto; }
.frame { display: flex; flex-direction: column; inline-size: 100%; margin-inline: auto; background: var(--paper); min-block-size: calc(100vh - 140px); }
@media (min-width: 720px) {
  .frame { max-inline-size: 420px; border: 1.5px solid var(--rule-strong); border-radius: var(--r); min-block-size: 760px; }
  .frame--wide { max-inline-size: 1040px; }
  .frame--wide .tabbar { display: none; }
}
.fp { padding-inline: var(--fp); }
.apphead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.wordmark { font-weight: 900; font-size: 18px; letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
#app[lang="en"] .wordmark { font-stretch: 112%; font-weight: 800; }
.wordmark i { display: inline-block; inline-size: 10px; block-size: 10px; border-radius: 999px; border: 3px solid var(--ink); }
.avatar { inline-size: 36px; block-size: 36px; border-radius: 999px; border: 1.5px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: var(--card); flex: none; }
.pagehead { padding-block: 12px 16px; display: grid; gap: 4px; }
.pagehead p { color: var(--ink-2); font-size: 15px; max-inline-size: 38ch; text-wrap: pretty; }
.body { padding-block: 0 32px; display: grid; gap: 24px; align-content: start; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row--between { justify-content: space-between; }
.row--wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-inline-size: 0; }

.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-block-start: 1.5px solid var(--rule-strong); z-index: 30; }
.tab {
  min-block-size: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 700; text-decoration: none; color: var(--ink-2);
  border-block-start: 3px solid transparent; margin-block-start: -1.5px;
}
.tab[aria-current="page"] { color: var(--ink); border-block-start-color: var(--ink); }
.has-tabs { padding-block-end: 72px; }
@media (max-width: 719.98px) {
  .tabbar { position: fixed; inset-inline: 0; inset-block-end: 0; padding-block-end: env(safe-area-inset-bottom, 0px); }
  .has-tabs { padding-block-end: calc(72px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 720px) {
  .tabbar { position: sticky; inset-block-end: 0; margin-block-start: auto; }
  .has-tabs { padding-block-end: 24px; }
}

/* ---------- primitives ---------- */
.card { background: var(--card); border: 1.5px solid var(--rule-strong); border-radius: var(--r); }
.pad { padding: 16px; }
.sl { display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin-block-end: 12px; }
#app[lang="fa"] .sl { font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 800; }
.sl::after { content: ""; display: block; inline-size: 32px; border-block-start: 1.5px solid var(--ink); margin-block-start: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-block-size: 48px; padding: 0 20px;
  border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--card); color: var(--ink);
  font-weight: 700; font-size: 15px; line-height: 1.2; text-decoration: none; text-align: center;
  transition-property: background-color, color, border-color, transform; transition-duration: 150ms; transition-timing-function: var(--ease);
}
.btn:hover { background: var(--paper-2); }
.btn:active { transform: scale(0.97); }
.btn--red { background: var(--plate-red); border-color: var(--plate-red); color: var(--on-plate); }
.btn--red:hover { background: var(--plate-red); filter: brightness(0.94); }
.btn--ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn--ink:hover { background: var(--ink); filter: brightness(1.08); }
.btn--danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn--blue { background: var(--plate-blue); border-color: var(--plate-blue); color: var(--on-plate); }
.btn--blue:hover { background: var(--plate-blue); filter: brightness(0.94); }
.btn--quiet { border-color: var(--ink-3); color: var(--ink-2); background: transparent; }
.btn--quiet:hover { border-color: var(--ink); color: var(--ink); background: var(--paper-2); }
.btn--ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 4px; padding: 0 8px; }
.btn--sm { min-block-size: 44px; padding: 0 14px; font-size: 14px; }
.btn--block { inline-size: 100%; }
.btn--xl { min-block-size: 64px; font-size: 20px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 1; background: var(--paper-2); border-color: var(--rule); color: var(--ink-3); cursor: not-allowed; transform: none; }
.btn[disabled]:hover { background: var(--paper-2); }
.iconbtn { min-block-size: 44px; min-inline-size: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--card); transition-property: background-color, transform; transition-duration: 150ms; }
.iconbtn:hover { background: var(--paper-2); }
.iconbtn:active { transform: scale(0.95); }
.iconbtn[disabled] { border-color: var(--rule); color: var(--ink-3); cursor: not-allowed; background: transparent; }
.iconbtn--bare { border-color: transparent; background: transparent; }
.chip {
  min-block-size: 44px; min-inline-size: 44px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--ink-3); border-radius: var(--r); background: var(--card); font-weight: 700; font-size: 16px;
  transition-property: background-color, color, border-color; transition-duration: 150ms;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:hover { border-color: var(--ink); }

.field { display: grid; gap: 6px; }
.field > label, .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.input {
  inline-size: 100%; min-block-size: 48px; padding: 8px 12px; background: var(--card); color: var(--ink);
  border: 1.5px solid var(--ink-3); border-radius: var(--r); font-size: 16px; line-height: 1.5;
  transition-property: border-color; transition-duration: 150ms;
}
.input:hover { border-color: var(--ink); }
.input:focus-visible { border-color: var(--ink); }
.input[aria-invalid="true"] { border-color: var(--danger); }
textarea.input { min-block-size: 76px; }
.err { color: var(--danger); font-size: 13px; font-weight: 600; }

/* ---------- stamp ---------- */
.stamp {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; min-block-size: 24px; border: 1.5px solid var(--ink); border-radius: var(--r);
  font-size: 12px; font-weight: 700; line-height: 1.2; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; background: transparent; color: var(--ink);
}
#app[lang="fa"] .stamp { font-size: 13px; letter-spacing: 0; text-transform: none; }
.stamp--blue { background: var(--plate-blue); border-color: var(--plate-blue); color: var(--on-plate); }
.stamp--yellow { background: var(--plate-yellow); border-color: var(--plate-yellow); color: var(--on-yellow); }
.stamp--green { background: var(--plate-green); border-color: var(--plate-green); color: var(--on-plate); }
.stamp--red { background: var(--plate-red); border-color: var(--plate-red); color: var(--on-plate); }
.stamp--danger { border-color: var(--danger); color: var(--danger); }
.stamp--mute { border-color: var(--ink-3); color: var(--ink-2); }
.stamp--lg { font-size: 18px; padding: 8px 18px; min-block-size: 0; outline: 1.5px solid var(--on-plate); outline-offset: -5px; letter-spacing: 0.12em; }
#app[lang="fa"] .stamp--lg { font-size: 22px; }
.stamp--yellow.stamp--lg { outline-color: var(--on-yellow); }
.stamp--land { animation: land 180ms var(--ease) both; transform: rotate(-3deg); }
@keyframes land { from { transform: scale(1.12) rotate(-3deg); opacity: 0; } to { transform: scale(1) rotate(-3deg); opacity: 1; } }

/* ---------- tally ---------- */
.tallies { display: inline-flex; align-items: center; gap: 8px; }
.tally { overflow: visible; flex: none; }
.tally path { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
.tally path.fresh { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 220ms var(--ease) forwards; }
@keyframes draw { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }

/* ---------- training card ---------- */
.tc { container-type: inline-size; background: var(--card); border: 1.5px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; }
.tc-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; padding: 10px 14px; background: var(--ink); color: var(--card); font-size: 14px; }
.tc-head b { font-weight: 800; }
.tc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 14px; border-block-end: 1px solid var(--rule); align-items: baseline; }
.tc-name { font-weight: 700; min-inline-size: 0; text-wrap: balance; }
.tc-target { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.tc-sets { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
.tc-set { white-space: nowrap; position: relative; min-block-size: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--rule); border-radius: var(--r); font-size: 15px; padding-inline: 14px; }
.tc-set--done { border-color: var(--ink-3); background: var(--paper); }
.tc-set--none::after { content: ""; inline-size: 14px; border-block-start: 1.5px solid var(--rule); }
.tc-stroke { position: absolute; inset-inline-start: 6px; inset-block: 11px; block-size: 22px; inline-size: 6px; overflow: visible; }
.tc-stroke path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.tc-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; font-size: 13px; color: var(--ink-2); background: var(--paper-2); }
.tc-foot b { color: var(--ink); }
@container (min-width: 540px) {
  .tc-row { grid-template-columns: minmax(0, 1.15fr) auto minmax(0, 2.5fr); align-items: center; }
  .tc-sets { grid-column: auto; }
  .tc-set { padding-inline: 18px 6px; font-size: 14px; white-space: nowrap; }
}

/* ---------- timetable ---------- */
.tt { display: grid; gap: 3px; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); align-items: stretch; }
.tt--mini { grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 3px; }
.tt-corner { min-block-size: 1px; }
.tt-day { display: grid; justify-items: center; align-content: end; gap: 2px; padding-block: 4px 6px; text-align: center; border-block-end: 1.5px solid var(--rule-strong); line-height: 1.25; }
.tt-wd { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.tt-dn { font-size: 20px; line-height: 1.1; }
.tt-mo { font-size: 12px; color: var(--ink-3); }
.tt-dn { position: relative; padding-block-end: 6px; }
.tt-day.is-today .tt-dn::after { content: ""; position: absolute; inset-inline: -2px; inset-block-end: 0; block-size: 3px; background: var(--ink); }
.tt-day.is-fri .tt-wd, .tt-day.is-fri .tt-dn { color: var(--ink-3); }
.tt-off { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.tt--mini .tt-day { padding-block: 2px 4px; }
.tt--mini .tt-dn { font-size: 15px; padding-block-end: 5px; }
.tt--mini .tt-wd { font-size: 12px; }
.tt-hour { display: flex; align-items: center; justify-content: flex-start; font-size: 12px; color: var(--ink-3); padding-inline-end: 4px; }
.tt--mini .tt-hour { font-size: 12px; justify-content: center; padding: 0; }
.tt-gap { grid-column: 1 / -1; block-size: 14px; position: relative; }
.tt--mini .tt-gap { block-size: 8px; }
.c {
  position: relative; min-block-size: 50px; display: flex; align-items: center; justify-content: center; border-radius: var(--r);
  font-size: 12px; font-weight: 700; padding: 0; border: 1px solid transparent; min-inline-size: 0; overflow: hidden;
  transition-property: background-color, border-color, opacity; transition-duration: 150ms; transition-timing-function: var(--ease);
}
.tt--mini .c { min-block-size: 18px; }
.c--open { border: 1.25px solid var(--ink-3); background-image: var(--hatch); background-color: var(--card); color: var(--ink); }
button.c--open { cursor: pointer; }
button.c--open:hover { background-color: var(--paper-2); border-color: var(--ink); }
.c--taken { background: var(--paper-2); border-color: var(--rule); }
.c--mine-c { background: var(--plate-blue); color: var(--on-plate); border-color: var(--plate-blue); }
.c--mine-p { background: var(--plate-yellow); color: var(--on-yellow); border-color: var(--plate-yellow); }
.c--closed { background: transparent; }
.c--closed::after { content: ""; inline-size: 3px; block-size: 3px; border-radius: 999px; background: var(--rule); }
.tt--mini .c--closed::after { display: none; }
.c--fri { background: var(--paper-2); opacity: 0.6; }
.c--fri::after { display: none; }
.is-off { opacity: 0.4; }
.c--open.is-off, .slotrow--open.is-off { background-image: none; background-color: var(--paper-2); border: 1px solid var(--rule); }
.c-plus { color: var(--ink-2); opacity: 0; transition: opacity 150ms var(--ease); }
button.c--open:hover .c-plus, button.c--open:focus-visible .c-plus { opacity: 1; }
.tt-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--ink-2); }
.tt-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { inline-size: 16px; block-size: 14px; border-radius: var(--r); border: 1px solid var(--rule); display: inline-block; flex: none; }
.sw--open { border: 1.25px solid var(--ink-3); background-image: var(--hatch); background-color: var(--card); }
.sw--taken { background: var(--paper-2); }
.sw--c { background: var(--plate-blue); border-color: var(--plate-blue); }
.sw--p { background: var(--plate-yellow); border-color: var(--plate-yellow); }
a.tt-link { display: block; text-decoration: none; color: inherit; border-radius: var(--r); }
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav .wk { font-weight: 800; text-align: center; flex: 1; text-wrap: balance; }
.daystrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border-block-end: 1px solid var(--rule); }
.dchip { min-block-size: 64px; display: grid; justify-items: center; align-content: center; gap: 0; padding: 4px 0 6px; border-block-end: 3px solid transparent; margin-block-end: -1px; color: var(--ink-2); line-height: 1.25; }
.dchip-wd { font-size: 12px; font-weight: 700; }
.dchip-n { font-size: 22px; line-height: 1.15; color: var(--ink); }
.dchip-c { font-size: 12px; color: var(--ink-3); min-block-size: 16px; }
.dchip.is-sel { border-block-end-color: var(--ink); }
.dchip.is-fri .dchip-n, .dchip.is-fri .dchip-wd { color: var(--ink-3); }
.dchip.is-past { opacity: 0.7; }
.slotlist { display: grid; gap: 8px; }
.slotrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-block-size: 56px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--rule); text-align: start; inline-size: 100%; background: transparent; }
.slotrow .time { font-weight: 800; font-size: 18px; }
.slotrow .st { font-size: 13px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.slotrow--open { border: 1.25px solid var(--ink-3); background-image: var(--hatch); background-color: var(--card); }
button.slotrow--open:hover { background-color: var(--paper-2); border-color: var(--ink); }
.slotrow--taken { background: var(--paper-2); }
.slotrow--mine-c { background: var(--plate-blue); color: var(--on-plate); border-color: var(--plate-blue); }
.slotrow--mine-c .st, .slotrow--mine-p .st { color: inherit; }
.slotrow--mine-p { background: var(--plate-yellow); color: var(--on-yellow); border-color: var(--plate-yellow); }
.dayoff { padding: 24px 16px; border: 1px dashed var(--ink-3); border-radius: var(--r); background: var(--paper-2); color: var(--ink-2); font-weight: 700; }

/* ---------- bookings list ---------- */
.bk { display: grid; gap: 8px; padding: 14px 16px; border-block-end: 1px solid var(--rule); }
.bk:last-child { border-block-end: 0; }
.bk h3 { font-size: 16px; font-weight: 800; line-height: 1.4; }
.bk-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.bk-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.bk.is-past .stamp { opacity: 1; }
.bk:focus-visible { outline-offset: -2px; }
.ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--danger); border-radius: var(--r); }
.ask b { font-weight: 800; color: var(--danger); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fadein 150ms var(--ease) both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  inline-size: 100%; max-inline-size: 520px; max-block-size: min(90vh, 100dvh - 16px); overflow: auto; overscroll-behavior: contain;
  background: var(--card); color: var(--ink); border: 1.5px solid var(--rule-strong); border-block-end: 0;
  border-start-start-radius: var(--r); border-start-end-radius: var(--r);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); animation: sheetin 180ms var(--ease) both;
  display: grid; gap: 16px; align-content: start;
}
@keyframes sheetin { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-grab { inline-size: 40px; block-size: 4px; border-radius: 999px; background: var(--rule); margin: 4px auto 0; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-sum { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); }
.sheet-sum .big { font-size: 22px; font-weight: 800; line-height: 1.3; }
.policy { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: var(--ink-2); }
.sent { display: grid; justify-items: start; gap: 12px; padding-block: 16px 8px; }
@media (min-width: 720px) {
  .scrim { align-items: center; }
  .sheet { border: 1.5px solid var(--rule-strong); border-radius: var(--r); }
}
.results { display: grid; max-block-size: 46vh; overflow: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); }
.res { display: grid; gap: 2px; text-align: start; padding: 10px 14px; min-block-size: 56px; border-block-end: 1px solid var(--rule); inline-size: 100%; }
.res:last-child { border-block-end: 0; }
.res:hover { background: var(--paper-2); }
.res b { font-weight: 700; }
.res .sub { font-size: 13px; color: var(--ink-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-block-start: 2px; }
.tag { font-size: 12px; font-weight: 700; padding: 0 6px; border: 1px solid var(--ink-3); border-radius: var(--r); color: var(--ink-2); line-height: 1.6; }

/* ---------- landing ---------- */
.lp { display: grid; gap: 48px; }
.lp-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px; }
.hero { display: grid; gap: 32px; }
.hero-name { font-size: clamp(64px, 19vw, 96px); font-weight: 900; line-height: 1.05; display: grid; margin-block: 4px 16px; }
#app[lang="fa"] .hero-name { line-height: 1.25; }
#app[lang="en"] .hero-name { font-stretch: 112%; font-weight: 800; letter-spacing: -0.02em; font-size: clamp(52px, 15.5vw, 84px); line-height: 0.98; }
.hero-name span { display: block; }
.lede { font-size: 20px; line-height: 1.6; max-inline-size: 30ch; text-wrap: pretty; }
#app[lang="fa"] .lede { line-height: 1.85; font-size: 19px; }
.cta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-block-start: 24px; }
.count { display: inline-flex; align-items: baseline; gap: 8px; }
.count .num { font-size: 40px; line-height: 1; }
.count span:last-child { font-size: 14px; color: var(--ink-2); max-inline-size: 12ch; line-height: 1.35; }
.board { padding: 14px 14px 12px; display: grid; gap: 12px; align-content: start; }
.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.board-head .sl { margin: 0; }
.steps { display: grid; border-block-start: 1.5px solid var(--rule-strong); }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; padding-block: 16px; border-block-end: 1px solid var(--rule); align-items: baseline; }
.step .n { font-size: 40px; line-height: 1; color: var(--ink); }
.step h3 { font-size: 19px; font-weight: 800; line-height: 1.4; }
.step p { grid-column: 2; color: var(--ink-2); text-wrap: pretty; }
.ledger { inline-size: 100%; border-collapse: collapse; }
.ledger th, .ledger td { padding: 12px 0; text-align: start; vertical-align: baseline; border-block-end: 1px solid var(--rule); }
.ledger th { font-weight: 700; color: var(--ink-2); padding-inline-end: 16px; inline-size: 38%; }
.ledger td { font-weight: 600; }
.ledger tr:first-child th, .ledger tr:first-child td { border-block-start: 1.5px solid var(--rule-strong); }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-block: 24px 8px; border-block-start: 1.5px solid var(--rule-strong); }
.foot .seg { border-color: var(--ink); }
.foot .seg button { color: var(--ink-2); }
.foot .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lp-cols { display: grid; gap: 48px; grid-template-areas: "steps" "card" "hours"; }
.a-steps { grid-area: steps; }
.a-card { grid-area: card; }
.a-hours { grid-area: hours; }
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: end; }
  .hero-name { font-size: clamp(96px, 9.5vw, 132px); }
  #app[lang="en"] .hero-name { font-size: clamp(80px, 8vw, 112px); }
  .lp-cols { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-areas: "steps card" "hours card"; gap: 56px 64px; align-items: start; }
  .lp { gap: 72px; }
}

/* ---------- stepper / set logger ---------- */
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { container-type: inline-size; display: grid; gap: 8px; min-inline-size: 0; }
.stepper-label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.stepper-val {
  inline-size: 100%; padding: 2px 0 4px; border: 0; border-block-end: 3px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink);
  text-align: center; font-size: clamp(44px, 36cqi, 72px); line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; min-inline-size: 0;
}
#app[lang="en"] .stepper-val { font-stretch: 75%; font-weight: 700; }
#app[lang="fa"] .stepper-val { font-weight: 800; line-height: 1.3; }
.stepper-val.long { font-size: clamp(36px, 28cqi, 58px); }
.stepper-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sbtn { min-block-size: 56px; min-inline-size: 56px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--card); transition-property: background-color, color, transform; transition-duration: 120ms; }
.sbtn .ic { inline-size: 28px; block-size: 28px; stroke-width: 2; }
.sbtn:hover { background: var(--paper-2); }
.sbtn:active { background: var(--ink); color: var(--paper); transform: scale(0.97); }
.stepper--sm { gap: 6px; container-type: normal; }
.stepper-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: stretch; }
.stepper--sm .stepper-val { font-size: 20px; border: 1.5px solid var(--ink); border-radius: 0; padding: 0 2px; line-height: 1.2; min-block-size: 44px; background: var(--card); }
#app[lang="en"] .stepper--sm .stepper-val { font-size: 22px; }
.stepper--sm .stepper-val:focus-visible { outline-offset: -1px; }
.stepper--sm .sbtn { min-block-size: 44px; min-inline-size: 44px; border-radius: 0; }
.stepper--sm .stepper-row > .sbtn:first-child { border-start-start-radius: var(--r); border-end-start-radius: var(--r); }
.stepper--sm .stepper-row > .sbtn:last-child { border-start-end-radius: var(--r); border-end-end-radius: var(--r); }
.stepper--sm .sbtn .ic { inline-size: 18px; block-size: 18px; }
.stepper--sm .stepper-label { font-size: 12px; }

.bb { display: grid; gap: 8px; padding: 12px 12px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--card); }
.bb .bbsvg { inline-size: 100%; block-size: auto; display: block; direction: ltr; }
.bb-bar { fill: var(--ink-2); }
.bb-sleeve { fill: var(--ink-3); }
.bb-collar { fill: var(--ink); }
.bb-knurl { stroke: var(--ink); stroke-width: 7; stroke-dasharray: 1.2 2.6; fill: none; }
.pl { stroke: var(--ink); stroke-width: 1.25; }
.pl--red { fill: var(--plate-red); }
.pl--blue { fill: var(--plate-blue); }
.pl--yellow { fill: var(--plate-yellow); }
.pl--green { fill: var(--plate-green); }
.pl--white { fill: var(--plate-white); }
.pl--silver { fill: var(--ink-3); }
.bb-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.bb-side { font-weight: 800; font-size: 15px; }
.pchips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pchip { min-inline-size: 30px; padding: 0 8px; border: 1.25px solid var(--ink); border-radius: var(--r); font-size: 13px; font-weight: 800; line-height: 1.7; text-align: center; }
.pchip--red { background: var(--plate-red); color: var(--on-plate); border-color: var(--plate-red); }
.pchip--blue { background: var(--plate-blue); color: var(--on-plate); border-color: var(--plate-blue); }
.pchip--yellow { background: var(--plate-yellow); color: var(--on-yellow); border-color: var(--plate-yellow); }
.pchip--green { background: var(--plate-green); color: var(--on-plate); border-color: var(--plate-green); }
.pchip--white { background: var(--plate-white); color: #141614; }
.pchip--silver { background: var(--ink-3); color: var(--paper); border-color: var(--ink-3); }
.bb-note { font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: flex-start; }
.bb-note .ic { margin-block-start: 3px; }
.bb-note.warn { color: var(--ink); font-weight: 600; }

/* ---------- workout ---------- */
.wk-head { display: grid; gap: 8px; padding-block: 12px 12px; }
.wk-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-2); align-items: center; }
.wk-meta .num { color: var(--ink); font-size: 16px; }
.segs { display: flex; gap: 3px; align-items: center; }
.segs i { flex: 1 1 0; block-size: 6px; border-radius: 1px; background: var(--paper-2); border: 1px solid var(--rule); }
.segs i.on { background: var(--plate-green); border-color: var(--plate-green); }
.segs i.cur { border-color: var(--ink); }
.segs i.gap { flex: 0 0 6px; background: transparent; border: 0; }
.exstrip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; margin-inline: -2px; }
.exchip { flex: none; scroll-snap-align: center; min-block-size: 56px; min-inline-size: 118px; padding: 6px 12px; display: grid; gap: 0; align-content: center; text-align: start; border: 1.5px solid var(--ink-3); border-radius: var(--r); background: var(--card); line-height: 1.35; transition-property: background-color, border-color; transition-duration: 150ms; }
.exchip b { font-size: 14px; font-weight: 700; }
.exchip small { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
.exchip[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.exchip[aria-current="true"] small { color: var(--paper-2); }
.exchip.done small { color: var(--plate-green); font-weight: 700; }
.exchip.done[aria-current="true"] small { color: var(--paper-2); }
.excard { display: grid; gap: 16px; padding: 16px; }
.ex-title { display: grid; gap: 2px; }
.ex-title h2 { font-size: 22px; line-height: 1.3; font-weight: 800; }
#app[lang="en"] .ex-title h2 { font-stretch: 112%; font-size: 20px; }
.ex-title .alt { font-size: 14px; color: var(--ink-3); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-block: 1px solid var(--rule); }
.fact { padding: 8px 0; display: grid; gap: 0; }
.fact + .fact { padding-inline-start: 12px; border-inline-start: 1px solid var(--rule); }
.fact .k { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.fact .v { font-size: 17px; font-weight: 700; line-height: 1.4; }
.rpe { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rpe .lbl { inline-size: 100%; }
.rest { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 14px; border: 1.5px solid var(--ink); border-radius: var(--r); background: var(--card); }
.rest.is-done { border-color: var(--plate-green); }
.ring { position: relative; inline-size: 68px; block-size: 68px; flex: none; }
.ring svg { inline-size: 100%; block-size: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--paper-2); stroke-width: 6; }
.ring .bar { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: butt; }
.rest.is-done .ring .bar { stroke: var(--plate-green); }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; }
.rest-txt { display: grid; gap: 0; }
.rest-txt b { font-size: 16px; }
.rest-btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sets { display: grid; border: 1.5px solid var(--rule-strong); border-radius: var(--r); background: var(--card); }
.sets-head, .setrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 14px; }
.sets-head { font-size: 12px; font-weight: 700; color: var(--ink-3); border-block-end: 1.5px solid var(--rule-strong); }
.setrow { border-block-end: 1px solid var(--rule); min-block-size: 52px; }
.setrow:last-child { border-block-end: 0; }
.setrow .no { font-size: 20px; }
.setrow .rw { font-size: 22px; line-height: 1.2; }
.setrow .rw small { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-inline-start: 6px; }
.setrow .e1 { font-size: 15px; color: var(--ink-2); text-align: end; display: grid; gap: 2px; justify-items: end; }
.setrow.fresh { animation: rowin 220ms var(--ease) both; }
@keyframes rowin { from { background: var(--paper-2); } to { background: transparent; } }
.sets-tally { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; min-block-size: 52px; border-block-end: 1px solid var(--rule); }
.sets-empty { padding: 16px 14px; color: var(--ink-2); font-size: 14px; }
.sets-foot { padding: 8px 14px; font-size: 12px; color: var(--ink-3); border-block-start: 1px solid var(--rule); }
.donebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1.5px solid var(--plate-green); border-radius: var(--r); }
.donebox b { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- charts ---------- */
.chartbox { padding: 14px 12px 8px; display: grid; gap: 8px; }
.chart svg { display: block; inline-size: 100%; block-size: auto; direction: ltr; overflow: visible; }
.ch-grid { stroke: var(--rule); stroke-width: 1; }
.ch-base { stroke: var(--rule-strong); stroke-width: 1.5; }
.ch-txt { fill: var(--ink-3); font-size: 12px; font-family: inherit; font-variant-numeric: tabular-nums; }
.ch-txt--ink { fill: var(--ink); font-weight: 800; font-size: 13px; }
.ch-line { fill: none; stroke: var(--ink); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.ch-dot { fill: var(--card); stroke: var(--ink); stroke-width: 1.75; }
.ch-end { fill: var(--plate-red); stroke: var(--card); stroke-width: 2.5; }
.ch-end--ink { fill: var(--ink); }
.ch-ring { fill: none; stroke: var(--plate-red); stroke-width: 1.5; }
.ch-bar { fill: var(--ink-2); }
.ch-bar--cur { fill: url(#vhatch); stroke: var(--ink); stroke-width: 1.5; }
.ch-pbg { fill: var(--card); }
.ch-pline { stroke: var(--ink); stroke-width: 2; }
.ch-bar--max { fill: var(--ink); }
.pick { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-inline: -2px; scrollbar-width: thin; }
.pick .chip { flex: none; font-size: 14px; }
.prs { display: grid; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 12px 16px; border-block-end: 1px solid var(--rule); }
.pr:last-child { border-block-end: 0; }
.pr .k { font-weight: 700; }
.pr .d { grid-column: 1; font-size: 13px; color: var(--ink-3); }
.pr .v { grid-column: 2; grid-row: 1 / span 2; font-size: 30px; line-height: 1; text-align: end; }
.pr .v small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-inline-start: 4px; }

/* ---------- coach ---------- */
.coach { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
.rail { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; border-block-end: 1.5px solid var(--rule-strong); margin-block-end: 16px; padding-block-end: 0; }
.rail::-webkit-scrollbar { display: none; }

/* Tally: groups of five, the fifth stroke crosses the four. `fresh` is the index of the stroke to draw. */
function tally(n, fresh, label) {
  if (n <= 0) return '';
  let out = '';
  let idx = 0;
  const groups = Math.ceil(n / 5);
  for (let g = 0; g < groups; g++) {
    const cnt = Math.min(5, n - g * 5);
    const strokes = Math.min(cnt, 4);
    let p = '';
    for (let i = 0; i < strokes; i++) {
      const x = 5 + i * 9;
      const j = (((g * 7 + i * 3) % 5) - 2) * 0.35;
      const k = (((g * 5 + i * 2) % 4) - 1.5) * 0.6;
      p += `<path pathLength="1"${idx === fresh ? ' class="fresh"' : ''} d="M${r2(x + j + 0.8)} ${r2(3 + k)} L${r2(x - j - 0.7)} ${r2(29 - k)}"/>`;
      idx++;
    }
    if (cnt === 5) {
      p += `<path pathLength="1"${idx === fresh ? ' class="fresh"' : ''} d="M0.5 25 C12 18.5 27 11 40.5 5"/>`;
      idx++;
    }
    const w = cnt >= 5 ? 43 : strokes * 9 + 3;
    out += `<svg class="tally" viewBox="0 0 ${w} 32" width="${w}" height="32" aria-hidden="true">${p}</svg>`;
  }
  return `<span class="tallies" role="img" aria-label="${esc(label || '')}">${out}</span>`;
}

}

  const txt = fmt(o.value);
  const attrs = o.attrs || '';
  const input = `<input class="stepper-val num${!o.small && txt.length > 4 ? ' long' : ''}" id="${o.id}" type="text" inputmode="${o.mode || 'decimal'}" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr" data-in="${o.act}" ${attrs} value="${esc(txt)}" aria-describedby="${o.id}-hint">`;
  const dec = `<button type="button" class="sbtn" id="${o.id}-dec" data-act="${o.act}-step" data-d="-1" ${attrs} aria-label="${esc(o.decLabel)}">${ico('minus')}</button>`;
  const inc = `<button type="button" class="sbtn" id="${o.id}-inc" data-act="${o.act}-step" data-d="1" ${attrs} aria-label="${esc(o.incLabel)}">${ico('plus')}</button>`;
  const hint = `<span class="sr-only" id="${o.id}-hint">${L('عدد را تایپ کن یا با دکمه‌ها تغییر بده.', 'Type a number or use the buttons.')}</span>`;
  const label = `<div class="stepper-label"><label for="${o.id}">${o.label}</label>${o.unit ? `<span aria-hidden="true">${o.unit}</span>` : ''}</div>`;
  if (o.small) return `<div class="stepper stepper--sm">${label}<div class="stepper-row">${dec}${input}${inc}</div>${hint}</div>`;
  return `<div class="stepper">${label}${input}${hint}<div class="stepper-btns">${dec}${inc}</div></div>`;
}

/* BarbellDiagram: 20 kg bar, plates per side picked greedily, drawn mirrored */
const BAR = 20;
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const PSTY = {
  25: { h: 98, w: 16, c: 'red' }, 20: { h: 88, w: 15, c: 'blue' }, 15: { h: 76, w: 13, c: 'yellow' },
  10: { h: 64, w: 12, c: 'green' }, 5: { h: 52, w: 9, c: 'white' }, 2.5: { h: 42, w: 7, c: 'red' }, 1.25: { h: 34, w: 6, c: 'silver' }
};
function loadPlates(w) {
  if (!(w >= BAR)) return { state: 'below', plates: [] };
  let rem = (w - BAR) / 2;
  const plates = [];
  PLATES.forEach((p) => { while (rem + 1e-9 >= p) { plates.push(p); rem -= p; } });
  const exact = rem < 1e-6;
  const side = plates.reduce((a, b) => a + b, 0);
  return { state: exact ? (plates.length ? 'ok' : 'empty') : 'inexact', plates, side, loaded: BAR + 2 * side };
}
function barbell(w) {
  const lp = loadPlates(w);
  const plates = lp.plates;
  const gap = 1.5;
  const total = plates.reduce((a, p) => a + PSTY[p].w, 0) + gap * Math.max(0, plates.length - 1);
  const k = total > 114 ? (114 - gap * Math.max(0, plates.length - 1)) / plates.reduce((a, p) => a + PSTY[p].w, 0) : 1;
  let plL = '', plR = '';
  let cl = 123, cr = 237;
  plates.forEach((p) => {
    const s = PSTY[p];
    const pw = r2(s.w * k);
    plL += `<rect class="pl pl--${s.c}" x="${r2(cl - pw)}" y="${r2(55 - s.h / 2)}" width="${pw}" height="${s.h}" rx="2.5"/>`;
    plR += `<rect class="pl pl--${s.c}" x="${r2(cr)}" y="${r2(55 - s.h / 2)}" width="${pw}" height="${s.h}" rx="2.5"/>`;
    cl -= pw + gap;
    cr += pw + gap;
  });
  const desc = lp.state === 'ok' ? L(`هر طرف ${fmt(lp.side)} کیلو صفحه`, `${fmt(lp.side)} kg of plates per side`) : L('میله', 'Bar');
  const svg = `<svg class="bbsvg" viewBox="0 2 360 106" role="img" aria-label="${esc(desc)}">
    <rect class="bb-bar" x="4" y="52" width="352" height="6" rx="1"/>
    <rect class="bb-sleeve" x="4" y="50" width="123" height="10" rx="1"/>
    <rect class="bb-sleeve" x="233" y="50" width="123" height="10" rx="1"/>
    <path class="bb-knurl" d="M150 55H210"/>
    <rect class="bb-collar" x="127" y="41" width="5" height="28" rx="1"/>
    <rect class="bb-collar" x="228" y="41" width="5" height="28" rx="1"/>
    ${plL}${plR}
  </svg>`;
  /* chips: group equal plates */
  const groups = [];
  plates.forEach((p) => { const g = groups[groups.length - 1]; if (g && g.p === p) g.n++; else groups.push({ p, n: 1 }); });
  const chips = groups.map((g) => `<span class="pchip pchip--${PSTY[g.p].c} num">${g.n > 1 ? fmt(g.n) + '×' : ''}${fmt(g.p)}</span>`).join('');
  let info = '', note = '';
  if (lp.state === 'ok') info = `<span class="bb-side num">${L('هر طرف: ', 'per side: ')}${fmt(lp.side)} ${kgU()}</span><span class="pchips">${chips}</span>`;
  else if (lp.state === 'empty') note = `<div class="bb-note">${ico('info')}<span>${L('فقط میله — ۲۰ کیلو.', 'Empty bar, 20 kg.')}</span></div>`;
  else if (lp.state === 'inexact') {
    info = `<span class="bb-side num">${L('هر طرف: ', 'per side: ')}${fmt(lp.side)} ${kgU()}</span><span class="pchips">${chips}</span>`;
    note = `<div class="bb-note warn">${ico('alert')}<span>${L(`با صفحه‌های معمولی نمی‌شود ${fmt(w)} کیلو بست؛ نزدیک‌ترین: ${fmt(lp.loaded)} کیلو.`, `${fmt(w)} kg can't be loaded with standard plates. Nearest: ${fmt(lp.loaded)} kg.`)}</span></div>`;
  } else {
    note = `<div class="bb-note warn">${ico('alert')}<span>${w > 0 ? L(`${fmt(w)} کیلو از وزن میله (۲۰ کیلو) کمتر است.`, `${fmt(w)} kg is under the 20 kg bar.`) : L('وزنه‌ای انتخاب نشده.', 'No weight selected.')}</span></div>`;
  }
  return `${svg}${info ? `<div class="bb-info">${info}</div>` : ''}${note}`;
}
/* ==========================================================================
   Timetable (mini / full grid / phone day list) + landing + booking screens
   ========================================================================== */
const ROWS = [7, 8, 9, 10, 11, 'gap', 16, 17, 18, 19, 20];
const weekDays = (offset) => { const s = weekStart(todayNum()) + 7 * offset; return [0, 1, 2, 3, 4, 5, 6].map((i) => s + i); };

function slotInfo(d, h) {
  if (!hoursOf(d).includes(h)) return { valid: false };
  const s = startOf(d, h);
  const now = Date.now();
  const bk = slotMap.get(sk(d, h));
  let raw = 'open';
  if (bk) raw = bk.client === 'sara' ? (bk.status === 'confirmed' ? 'mine-c' : 'mine-p') : 'taken';
  let time = 'ok';
  if (s < now) time = 'past';
  else if (s < now + 12 * HOUR) time = 'soon';
  else if (s > now + 21 * DAY) time = 'far';
  return { valid: true, raw, time, bk, s };
}
const bookable = (i) => i.valid && i.raw === 'open' && i.time === 'ok';
function slotStatus(i) {
  if (i.raw === 'mine-c') return L('تأیید شد', 'Confirmed');
  if (i.raw === 'mine-p') return L('در انتظار تأیید', 'Pending');
  if (i.raw === 'taken') return L('پر', 'Taken');
  if (i.time === 'past') return L('گذشته', 'Past');
  if (i.time === 'soon') return L('کمتر از ۱۲ ساعت مانده', 'Starts in under 12 hours');
  if (i.time === 'far') return L('هنوز باز نشده', 'Not open yet');
  return L('خالی', 'Open');
}
function openCount(days) {
  let n = 0;
  days.forEach((d) => hoursOf(d).forEach((h) => { if (bookable(slotInfo(d, h))) n++; }));
  return n;
}
/* the live week: this week, unless it is nearly over, then next week (labelled honestly) */
function defaultOffset() { return openCount(weekDays(0)) < 6 ? 1 : 0; }
const weekName = (off) => (off === 0 ? L('این هفته', 'This week') : off === 1 ? L('هفته‌ی بعد', 'Next week') : L(`${fmt(off)} هفته‌ی دیگر`, `In ${off} weeks`));
function weekRange(days) {
  const a = days[0], b = days[6];
  if (dMonth(a) === dMonth(b)) return isFa() ? `${dNum(a)} تا ${dNum(b)} ${dMonth(b)}` : `${dNum(a)} – ${dNum(b)} ${dMonth(b)}`;
  return isFa() ? `${dNum(a)} ${dMonth(a)} تا ${dNum(b)} ${dMonth(b)}` : `${dNum(a)} ${dMonth(a)} – ${dNum(b)} ${dMonth(b)}`;
}

function headCell(d, mini) {
  const fri = isFriday(d), today = d === todayNum();
  return `<div class="tt-day${today ? ' is-today' : ''}${fri ? ' is-fri' : ''}"><span class="tt-wd">${mini ? dWeekdayShort(d) : dWeekday(d)}</span><span class="tt-dn num">${dNum(d)}</span>${mini ? '' : (fri ? `<span class="tt-off">${L('تعطیل', 'Closed')}</span>` : `<span class="tt-mo">${dMonth(d)}</span>`)}</div>`;
}
function cellHtml(d, h, mode) {
  if (isFriday(d)) return '<div class="c c--fri" aria-hidden="true"></div>';
  const i = slotInfo(d, h);
  if (!i.valid) return '<div class="c c--closed" aria-hidden="true"></div>';
  const raw = mode === 'mini' && i.raw.indexOf('mine') === 0 ? 'taken' : i.raw;
  const cls = `c c--${raw}${i.time !== 'ok' ? ' is-off' : ''}`;
  if (mode === 'mini') return `<div class="${cls}" aria-hidden="true"></div>`;
  const label = `${dLong(d)}، ${hm(h)} — ${slotStatus(i)}`;
  if (bookable(i)) return `<button type="button" class="${cls}" id="slot-${d}-${h}" data-act="slot" data-day="${d}" data-hour="${h}" aria-label="${esc(label)}">${ico('plus', 'c-plus')}</button>`;
  const txt = i.raw === 'mine-c' ? L('تأیید شد', 'Confirmed') : i.raw === 'mine-p' ? L('در انتظار', 'Pending') : '';
  return `<div class="${cls}" id="slot-${d}-${h}" role="img" aria-label="${esc(label)}">${txt}</div>`;
}
function ttGrid(off, mode) {
  const days = weekDays(off);
  const mini = mode === 'mini';
  let h = `<div class="tt ${mini ? 'tt--mini' : 'tt--full'}"${mini ? ' aria-hidden="true"' : ` role="group" aria-label="${esc(L('جدول رزرو هفته', 'Booking timetable for the week'))}"`}>`;
  h += '<div class="tt-corner"></div>' + days.map((d) => headCell(d, mini)).join('');
  ROWS.forEach((r) => {
    if (r === 'gap') { h += '<div class="tt-gap"></div>'; return; }
    h += `<div class="tt-hour num">${mini ? pad2(r) : hm(r)}</div>` + days.map((d) => cellHtml(d, r, mode)).join('');
  });
  return h + '</div>';
}
const legend = (mine) => `<div class="tt-legend" aria-hidden="true">
  <span><i class="sw sw--open"></i>${L('خالی', 'Open')}</span>
  <span><i class="sw sw--taken"></i>${L('پر', 'Taken')}</span>

/* ---------- booking (client) ---------- */
const B = { offset: null, day: null, ask: null, focusAfter: null };
const isWide = () => window.matchMedia('(min-width: 720px)').matches;
const bookOffset = () => { if (B.offset == null) B.offset = defaultOffset(); return B.offset; };
function bookDay(days) {
  if (B.day != null && days.includes(B.day)) return B.day;
  const t = todayNum();
  let pick = days.find((d) => hoursOf(d).some((h) => bookable(slotInfo(d, h))));
  if (pick == null) pick = days.find((d) => d >= t && !isFriday(d));
  if (pick == null) pick = days[0];
  B.day = pick;
  return pick;
}
const rng = (a, b) => (isFa() ? bdn(`${hm(a)} تا ${hm(b)}`) : `<bdi>${hm(a)}–${hm(b)}</bdi>`);
const rangeTxt = (h) => rng(h, h + 1);

function dayStripHtml(days, sel) {
  return `<div class="daystrip" role="group" aria-label="${esc(L('روزهای هفته', 'Days of the week'))}">` + days.map((d) => {
    const c = hoursOf(d).filter((h) => bookable(slotInfo(d, h))).length;
    const fri = isFriday(d);
    const label = `${dLong(d)}${fri ? '، ' + L('تعطیل', 'closed') : '، ' + L(`${fmt(c)} ساعت خالی`, `${c} open`)}`;
    return `<button type="button" class="dchip${d === sel ? ' is-sel' : ''}${fri ? ' is-fri' : ''}${d < todayNum() ? ' is-past' : ''}" id="dchip-${d}" data-act="pick-day" data-day="${d}" aria-pressed="${d === sel}" aria-label="${esc(label)}"><span class="dchip-wd">${dWeekdayShort(d)}</span><span class="dchip-n num">${dNum(d)}</span><span class="dchip-c num">${fri ? '' : (c ? fmt(c) : '–')}</span></button>`;
  }).join('') + '</div>';
}
function slotListHtml(d) {
  const hs = hoursOf(d);
  if (!hs.length) return `<div class="dayoff">${L('جمعه تعطیل است.', 'Friday is a day off.')}</div>`;
  return `<ul class="slotlist" aria-label="${esc(dLong(d))}">` + hs.map((h) => {
    const i = slotInfo(d, h);
    const cls = `slotrow slotrow--${i.raw}${i.time !== 'ok' ? ' is-off' : ''}`;
    const label = `${dLong(d)}، ${hm(h)} — ${slotStatus(i)}`;
    const time = `<span class="time num">${rangeTxt(h)}</span>`;
    if (bookable(i)) return `<li><button type="button" class="${cls}" id="slot-${d}-${h}" data-act="slot" data-day="${d}" data-hour="${h}" aria-label="${esc(label)}">${time}<span class="st">${L('رزرو', 'Book')}${icoD('chevR')}</span></button></li>`;
    const st = i.raw === 'mine-c' ? ico('check') + L('تأیید شد', 'Confirmed') : i.raw === 'mine-p' ? ico('clock') + L('در انتظار تأیید', 'Pending') : slotStatus(i);
    return `<li><div class="${cls}" id="slot-${d}-${h}" role="img" aria-label="${esc(label)}">${time}<span class="st">${st}</span></div></li>`;
  }).join('') + '</ul>';
}
const canCancel = (b) => startOf(b.day, b.hour) - Date.now() >= 24 * HOUR;

function bookingRow(b) {
  const s = startOf(b.day, b.hour);
  const upcoming = s > Date.now();
  let st, actions = '';
  if (b.status === 'cancelled') st = stamp('mute', L('لغو شد', 'Cancelled'));
  else if (b.status === 'declined') st = stamp('danger', L('رد شد', 'Declined'));
  else if (!upcoming) st = stamp('green', L('انجام شد', 'Done'));
  else if (b.status === 'confirmed') st = stamp('blue', L('تأیید شد', 'Confirmed'));
  else st = stamp('yellow', L('در انتظار تأیید', 'Pending'));
  if (isLive(b) && upcoming) {
    if (B.ask === b.id) {
      actions = `<div class="ask" role="group" aria-label="${esc(L('تأیید لغو', 'Confirm cancellation'))}"><b>${L('این رزرو لغو شود؟', 'Cancel this booking?')}</b><button type="button" class="btn btn--sm btn--danger" id="${b.id}-yes" data-act="bk-yes" data-id="${b.id}">${L('بله، لغو کن', 'Yes, cancel')}</button><button type="button" class="btn btn--sm" id="${b.id}-no" data-act="bk-no" data-id="${b.id}">${L('نه، بماند', 'Keep it')}</button></div>`;
    } else if (canCancel(b)) {
      actions = `<div class="bk-actions"><button type="button" class="btn btn--sm btn--quiet" id="${b.id}-cancel" data-act="bk-ask" data-id="${b.id}">${L('لغو رزرو', 'Cancel booking')}</button><span class="cap">${L('تا ۲۴ ساعت قبل از جلسه رایگان است.', 'Free until 24 hours before.')}</span></div>`;
    } else {
      actions = `<div class="bk-actions"><button type="button" class="btn btn--sm" id="${b.id}-cancel" disabled aria-describedby="${b.id}-why">${L('لغو رزرو', 'Cancel booking')}</button></div>
        <p class="cap" id="${b.id}-why">${ico('info')} ${L('مهلت لغو (۲۴ ساعت قبل از جلسه) تمام شده. برای تغییر با مربی تماس بگیر.', 'The 24-hour cancellation window has closed. To change it, call your coach.')}</p>
        <a class="btn btn--sm" href="tel:09120000000" id="${b.id}-call">${ico('phone')}<bdi dir="ltr" class="num">${fdig(COACH_PHONE)}</bdi></a>`;
    }
  }
  const note = noteText(b);

function parseReps(txt) {

  const parts = t.split(/\s*(?:-|–|—|~|تا|to)\s*/i).map((x) => parseInt(x.replace(/\D/g, ''), 10)).filter((x) => !isNaN(x));
  if (parts.length === 1 && parts[0] >= 1) return { rmin: Math.min(parts[0], 100), rmax: null };

}

  'addex-pick': (t) => {
    const e = EXB[t.dataset.ex];
    const x = it(e.id, 3, 10, null, e.eq === 'barbell' ? 20 : e.eq === 'body' ? 0 : 10, 90);
    dayOf(P.active).items.push(x);
    P.saved = false;
    P.freshUid = x.uid;
    rerender('builder');
    SH.focusAfter = 'bi-' + x.uid + '-sets';
    closeSheet();
    const f = $('#brow-' + x.uid);
    if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center' });
    announce(L(`${exName(e.id)} به روز ${P.active} اضافه شد.`, `${exName(e.id)} added to day ${P.active}.`));
    setTimeout(() => { P.freshUid = 0; }, 800);
  },
  'b-save': () => {
    P.saved = true;
    const st = $('#save-status');
    if (st) st.textContent = L('ذخیره شد، همین الان', 'Saved · just now');
    announce(L('برنامه ذخیره شد.', 'Program saved.'));
  }
};
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || !app.contains(t)) return;
  if (t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, e);
});

/* ---------- typing ---------- */
app.addEventListener('input', (e) => {
  const t = e.target;
  const kind = t.dataset && t.dataset.in;
  if (!kind) return;
  if (kind === 'lg') {
    const n = parseNum(t.value);
    if (isNaN(n)) { t.setAttribute('aria-invalid', 'true'); return; }
    t.removeAttribute('aria-invalid');
    const v = W.vals[W.cur];
    if (t.dataset.f === 'w') v.w = clamp(r2(n), 0, 400);
    else v.r = clamp(Math.round(n), 1, 60);
    syncLogger();
  } else if (kind === 'book-note') {
    SH.note = t.value;
  } else if (kind === 'ex-search') {
    SH.q = t.value;
    const res = searchEx(SH.q);
    $('#ex-results').innerHTML = resultsHtml(res);
    $('#ex-count').textContent = L(`${fmt(res.length)} حرکت`, `${res.length} exercises`);
  } else if (kind === 'bf') {
    const x = findItem(+t.dataset.uid);
    if (!x) return;
    const f = t.dataset.f;
    if (f === 'note') x.note[lang] = t.value;
    else if (f === 'reps') {
      const r = parseReps(t.value);
      if (!r) { t.setAttribute('aria-invalid', 'true'); return; }
      t.removeAttribute('aria-invalid');
      x.rmin = r.rmin; x.rmax = r.rmax;
    } else {
      const n = parseNum(t.value);
      if (isNaN(n)) { t.setAttribute('aria-invalid', 'true'); return; }
      t.removeAttribute('aria-invalid');
      x[f] = f === 'sets' ? clamp(Math.round(n), 1, 12) : f === 'rest' ? clamp(Math.round(n), 0, 600) : clamp(r2(n), 0, 400);
    }
    builderLive(x, null);
  } else if (kind === 'prog-title') {
    P.title[lang] = t.value; P.saved = false;
    const st = $('#save-status'); if (st) st.textContent = savedText();
  } else if (kind === 'day-title') {
    dayOf(P.active).title[lang] = t.value;
    builderLive(null, null);
  }
});
app.addEventListener('focusout', (e) => {
  const t = e.target;
  const kind = t.dataset && t.dataset.in;
  if (kind === 'lg') {
    const v = W.vals[W.cur][t.dataset.f];
    t.value = fmt(v);
    t.classList.toggle('long', t.value.length > 4);
    t.removeAttribute('aria-invalid');
  } else if (kind === 'bf') {
    const x = findItem(+t.dataset.uid);
    if (x) t.value = bValText(x, t.dataset.f);
    t.removeAttribute('aria-invalid');
  }
});
document.addEventListener('keydown', (e) => {
  if (SH.open) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab') { trapTab(e); return; }
  }
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && (t.dataset.in === 'lg' || t.dataset.in === 'bf') && t.tagName === 'INPUT') { e.preventDefault(); t.blur(); return; }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) >= 0 && t.classList && t.classList.contains('c--open') && t.closest('.tt--full')) {
    const cur = t.getBoundingClientRect();
    const cx = cur.x + cur.width / 2, cy = cur.y + cur.height / 2;
    let best = null, bd = 1e9;
    $$('.tt--full button.c--open').forEach((o) => {
      if (o === t) return;
      const r = o.getBoundingClientRect();
      const dx = r.x + r.width / 2 - cx, dy = r.y + r.height / 2 - cy;
      let ok = false, dist = 0;
      if (e.key === 'ArrowRight') { ok = dx > 4; dist = Math.abs(dx) + Math.abs(dy) * 3; }
      else if (e.key === 'ArrowLeft') { ok = dx < -4; dist = Math.abs(dx) + Math.abs(dy) * 3; }
      else if (e.key === 'ArrowDown') { ok = dy > 4; dist = Math.abs(dy) + Math.abs(dx) * 3; }
      else { ok = dy < -4; dist = Math.abs(dy) + Math.abs(dx) * 3; }
      if (ok && dist < bd) { bd = dist; best = o; }
    });
    if (best) { e.preventDefault(); best.focus(); }
  }
});
window.addEventListener('hashchange', route);
const mqWide = window.matchMedia('(min-width: 720px)');
if (mqWide.addEventListener) mqWide.addEventListener('change', () => rerender());
let rzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => { if (state.screen === 'progress') drawCharts(); }, 120);
});
const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
if (mqDark.addEventListener) mqDark.addEventListener('change', () => renderChrome());
setInterval(tickWorkout, 250);

/* ---------- boot ---------- */
(function boot() {
  const sl = store.get('daftar-lang');
  if (sl === 'en' || sl === 'fa') lang = sl;
  const th = store.get('daftar-theme');
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  seedBookings();
  applyRoot();
  route();
})();
})();
</script>
